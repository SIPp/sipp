name: C/C++ CI

on: [push, pull_request]

# A newer push or merge supersedes the runs before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: lint
      run: ./validate-src.sh
    - name: lint-xml
      run: sudo apt-get update && sudo apt-get install --yes libxml2-utils && ./dtd_check.sh
    - name: test-multi-instance-launcher
      run: python3 -m unittest discover -s tests -p 'test_sipp_multi.py'

  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: prepare
      run: git submodule update --init
    - name: installdeps
      run: sudo apt-get update && sudo apt-get install --yes build-essential cmake libpcap-dev openssl libssl-dev libgsl-dev libsctp-dev libncurses-dev libncurses6 python3-websockets
    - name: build
      run: ./build.sh --full
    - name: install
      run: |
        cmake --install . --prefix "$RUNNER_TEMP/sipp-install"
        test -x "$RUNNER_TEMP/sipp-install/bin/sipp-multi.py"
    - name: allow-userns
      # the raw socket tests re-run in a user and network namespace
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: test
      run: TEST_SKIP_VALGRIND=1 ./regress/runtests

  build-system-gtest:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7
    - name: installdeps
      run: sudo apt-get update && sudo apt-get install --yes build-essential cmake libpcap-dev openssl libssl-dev libgsl-dev libsctp-dev libncurses-dev libncurses6 libgtest-dev libpugixml-dev python3-websockets
    - name: build
      run: |
        cmake . -DUSE_SCTP=1 -DUSE_PCAP=1 -DUSE_GSL=1 -DUSE_SYSTEM_GTEST=ON -DUSE_SYSTEM_PUGIXML=ON
        make -j$(nproc)
    - name: unittest
      run: |
        make -j$(nproc) sipp_unittest
        ./sipp_unittest
    - name: allow-userns
      # the raw socket tests re-run in a user and network namespace
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
    - name: test
      run: TEST_SKIP_VALGRIND=1 ./regress/runtests

  build-osx:

    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v7
    - name: prepare
      run: |
        git submodule update --init
        brew install openssl@3
    - name: build
      run: |
        export OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
        ./build.sh --none


  build-static:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: prepare
      run: git submodule update --init
    - name: build-static
      run: docker build -f docker/Dockerfile --output=. --target=bin .
    - uses: actions/upload-artifact@v7
      with:
         name: sipp
         path: ./sipp

  build-wolfssl:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: prepare
      run: git submodule update --init
    - name: build-wolfssl
      # and run the TLS and SRTP regress tests against the wolfSSL build
      run: >
        docker build -f docker/Dockerfile.debian --build-arg WOLFSSL=1
        --build-arg UNITTEST=1
        --build-arg REGRESS="github-#0583 github-#0601 github-#0611
        github-#0631 github-#0773 github-#0857 github-#0951 github-#0990
        github-#0996" .
